services:
  - type: web
    name: global-agent-backend
    runtime: java
    plan: free
    buildCommand: "./mvnw clean package -DskipTests -B"
    startCommand: "java -jar target/*.jar"
    envVars:
      - key: JAVA_VERSION
        value: "17"
      - key: SPRING_PROFILES_ACTIVE
        value: "prod"
      - key: PORT
        value: "3003"
      - key: PG_HOST
        sync: false
      - key: PG_PORT
        value: "5432"
      - key: PG_DATABASE
        value: "global_agent"
      - key: PG_USER
        sync: false
      - key: PG_PASSWORD
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_BASE64
        sync: false
    healthCheckPath: /
